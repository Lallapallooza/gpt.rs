name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs the pre-commit hooks, so CI runs the same file checks as a local commit.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install

      - name: Install the nightly rustfmt of the cargo-fmt hook
        run: >-
          rustup toolchain install --profile minimal --component rustfmt
          "$(grep -oP 'RUSTUP_TOOLCHAIN=\K\S+' .pre-commit-config.yaml)"

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the Python environment
        run: uv sync --extra dev

      - name: Run the pre-commit hooks
        run: uv run --extra dev pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Fetch the GPT-2 tokenizer
        run: |
          mkdir -p configs
          curl -fsSL https://huggingface.co/gpt2/resolve/main/tokenizer.json \
            -o configs/gpt2_tokenizer.json

      - name: Run tests (workspace)
        run: >-
          cargo test --workspace
          --exclude gpt-rs-py
          --exclude gpt-rs-backend-c

      - name: Run the profiler tests
        run: cargo test -p gpt-rs --features profiler --test 'profiling*'
