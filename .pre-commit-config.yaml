# `pre-commit install` installs both the checks and the commit-message hook.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
  # The Python tools run from the project environment, so uv.lock pins their versions and the type
  # checkers see the installed packages.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --extra dev ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --extra dev ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --extra dev mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: basedpyright
        name: basedpyright
        entry: uv run --extra dev basedpyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: ptir-docs
        name: docs/ptir matches the code
        entry: cargo run -q -p gpt-rs-docs -- --check
        language: system
        files: '\.(rs|ptir)$|^crates/gpt-rs-ir/src/(dialects/tensor|passes)/README\.md$|^docs/ptir/'
        pass_filenames: false
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.9.1
    hooks:
      - id: commitizen
        stages: [commit-msg]
