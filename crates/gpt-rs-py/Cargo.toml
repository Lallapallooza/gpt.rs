[package]
name = "gpt-rs-py"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Python bindings for gpt-rs."

[lib]
name = "gpt_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
numpy = "0.22"
gpt-rs = { path = "../gpt-rs", version = "0.1.0" }
gpt-rs-backend-ref-cpu = { path = "../gpt-rs-backend-ref-cpu", version = "0.1.0" }
gpt-rs-backends = { path = "../gpt-rs-backends", version = "0.1.0" }
thiserror.workspace = true
anyhow.workspace = true
rand.workspace = true
serde_json = "1"

[features]
default = ["cpu"]
cpu = []
faer = ["gpt-rs-backends/faer"]
conversion-c = ["gpt-rs-backends/c"]
x86 = ["gpt-rs-backends/x86"]
profiler = ["gpt-rs/profiler"]
