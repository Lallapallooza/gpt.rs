[package]
name = "gpt-rs-backend-faer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "faer-based CPU backend for gpt-rs portable tensor IR (PTIR)."

[features]
default = []
torch = ["gpt-rs-backend-tests/torch"]

[dependencies]
anyhow = { workspace = true }
bytemuck = "1"
faer = "0.23"
gemm-common = { version = "0.18", default-features = false, features = ["std"] }
gpt-rs = { path = "../gpt-rs", version = "0.1.0" }
gpt-rs-ir = { path = "../gpt-rs-ir", version = "0.1.0" }
half = "2.6"

[dev-dependencies]
gpt-rs-backend-tests = { path = "../gpt-rs-backend-tests", version = "0.1.0" }
