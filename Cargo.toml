[workspace]
members = [
    "crates/gpt-rs",
    "crates/gpt-rs-cli",
    "crates/gpt-rs-backend-c",
    "crates/gpt-rs-backend-ref-cpu",
    "crates/gpt-rs-backend-faer",
    "crates/gpt-rs-backend-tests",
    "crates/gpt-rs-backend-x86",
    "crates/gpt-rs-backends",
    "crates/gpt-rs-docs",
    "crates/gpt-rs-filetests",
    "crates/gpt-rs-ir",
    "crates/gpt-rs-ir-lexer",
    "crates/gpt-rs-ir-macros",
    "crates/gpt-rs-macros",
    "crates/gpt-rs-py",
]
default-members = [
    "crates/gpt-rs",
    "crates/gpt-rs-cli",
    "crates/gpt-rs-backend-c",
    "crates/gpt-rs-backend-ref-cpu",
    "crates/gpt-rs-backend-faer",
    "crates/gpt-rs-backend-tests",
    "crates/gpt-rs-backend-x86",
    "crates/gpt-rs-backends",
    "crates/gpt-rs-docs",
    "crates/gpt-rs-filetests",
    "crates/gpt-rs-ir",
    "crates/gpt-rs-ir-lexer",
    "crates/gpt-rs-ir-macros",
    "crates/gpt-rs-macros",
    "crates/gpt-rs-py",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"
authors = ["gpt.rs contributors"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1", features = ["union"] }
thiserror = "1"
tinyvec = "1.13"

# The shape of the code: short, shallow functions, and names that say what a value holds, each
# given once. A crate opts in, with `[lints] workspace = true`, once it is clean. The thresholds
# are in `clippy.toml`.
[workspace.lints.clippy]
too_many_lines = "warn"
excessive_nesting = "warn"
min_ident_chars = "warn"
many_single_char_names = "warn"
shadow_reuse = "warn"
shadow_unrelated = "warn"

# Optimized in debug builds too: its interpreter runs the filetests' differential checks and the
# ref-cpu backend.
[profile.dev.package.gpt-rs-ir]
opt-level = 2
