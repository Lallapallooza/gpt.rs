# x86-64-v4: the Intel Xeon Platinum 8180, a Skylake-SP part of the x86-64 level with AVX-512 F,
# BW, CD, DQ and VL, as the x86-64 psABI defines its microarchitecture levels. For another part,
# probe the machine (`host`) or write a target file.
#
# Sources: Intel's specifications of the Xeon Platinum 8180 for its 28 cores and its 38.5 MiB L3;
# the Intel 64 and IA-32 Architectures Optimization Reference Manual (the Skylake Server
# microarchitecture) for the cache geometry, an L1d of 32 KiB in 8 ways and an L2 of 1 MiB in 16
# ways per core, an L3 in 11 ways that the cores share, and 64-byte lines; and uops.info for the
# costs of Skylake-X's instructions, whose cores are the 8180's.
description = "Intel Xeon Platinum 8180 (Skylake-SP), 28 cores, from Intel's documents and uops.info"

[isa]
arch = "x86_64"
features = ["sse4.2", "popcnt", "avx", "avx2", "fma", "f16c", "bmi2", "avx512f", "avx512bw",
            "avx512cd", "avx512dq", "avx512vl"]
vector_bits = [128, 256, 512]
vector_registers = 32
write_masks = 7
cc_march = "x86-64-v4"
page = 4096

# The execution levels: the L3 domains, each the cores that share one L3, and the cores.
[[level]]
name = "l3"
units = 1

[[level]]
name = "core"
units = 28

# The memories: the registers, the L1 and L2 of a core, the L3 of a domain, and DRAM. A copy held
# for a cache lives in a core's private scratch, and a prefetch asks the L1, L2 and L3 for lines
# with the hints T0, T1 and T2.
[[memory]]
name = "registers"
kind = "registers"
level = "core"

[[memory]]
name = "l1"
kind = "cache"
bytes = 32768
level = "core"
line = 64
ways = 8
space = "private"
prefetch = "t0"

[[memory]]
name = "l2"
kind = "cache"
bytes = 1048576
level = "core"
line = 64
ways = 16
space = "private"
prefetch = "t1"

[[memory]]
name = "l3"
kind = "cache"
bytes = 40370176
level = "l3"
line = 64
ways = 11
space = "private"
prefetch = "t2"

# DRAM holds the buffers of a launch, which start at a multiple of 64 bytes: the line that the x86
# runtime aligns its arenas and tensors to.
[[memory]]
name = "dram"
kind = "main"
alignment = 64

# The costs are those of Skylake-SP with two 512-bit FMA units, as the 8180 has them, on 512-bit
# vectors of f32 (uops.info), stated for every dtype. A broadcast from memory runs on the load
# ports.
[[cost]]
op = "isa.add"
width = 512
latency = 4
issue = 2

# Minimum and maximum run on the adder, at its latency and rate.
[[cost]]
op = "isa.maximum"
width = 512
latency = 4
issue = 2

[[cost]]
op = "isa.minimum"
width = 512
latency = 4
issue = 2

[[cost]]
op = "isa.mul"
width = 512
latency = 4
issue = 2

[[cost]]
op = "isa.fma"
width = 512
latency = 4
issue = 2

[[cost]]
op = "isa.load"
width = 512
issue = 2

[[cost]]
op = "isa.broadcast"
width = 512
issue = 2

# A store issues one a cycle.
[[cost]]
op = "isa.store"
width = 512
issue = 1
