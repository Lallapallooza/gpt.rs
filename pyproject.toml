[project]
name = "gptrs-tools"
version = "0.1.0"
description = "Helper scripts for validating gpt.rs models against Torch."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.12,<2",
    "huggingface-hub>=1.3,<2",
    "numpy>=1.24,<3",
    "safetensors>=0.4.3,<1",
    "torch>=2.3.0,<3",
    "transformers>=5.2,<6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.8",
    "basedpyright>=1.31",
    "pre-commit>=3.7",
    "commitizen>=3.30",
]

[tool.ruff]
line-length = 100
src = ["scripts"]
# The bindings support Python 3.9 (their requires-python).
per-file-target-version = { "crates/gpt-rs-py/**" = "py39" }

[tool.ruff.lint]
# Listed in full, so a change to ruff's default rule set does not change the checks.
select = ["E4", "E7", "E9", "F", "B", "C4", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"crates/gpt-rs-py/examples/*.py" = ["T201"]
"crates/gpt-rs-py/test_install.py" = ["T201"]

[tool.mypy]
python_version = "3.10"
files = ["scripts"]
warn_unused_configs = true
warn_unreachable = true
namespace_packages = true
exclude = ["crates/gpt-rs-py/"]

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "numpy.*", "gpt_rs.*", "pytest.*", "scipy.*"]
ignore_missing_imports = true

[tool.basedpyright]
include = ["scripts"]
extraPaths = ["scripts"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
# The cargo provider bumps [workspace.package].version in Cargo.toml and the members in Cargo.lock.
version_provider = "cargo"
version_scheme = "semver"
major_version_zero = true
# Path dependencies between workspace crates also pin the version.
version_files = [
    "crates/*/Cargo.toml:path = ",
]
