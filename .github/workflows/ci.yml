name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Fetch the GPT-2 tokenizer
        run: |
          mkdir -p configs
          curl -fsSL https://huggingface.co/gpt2/resolve/main/tokenizer.json \
            -o configs/gpt2_tokenizer.json

      - name: Run tests (workspace)
        run: >-
          cargo test --workspace
          --exclude gpt-rs-py
          --exclude gpt-rs-backend-c
          --exclude gpt-rs-backend-triton
