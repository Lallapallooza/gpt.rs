[package]
name = "gpt-rs-filetests"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The filetest runner of gpt.rs, for the IR passes and for each backend's passes."
publish = false

[features]
default = []
# The runner of backend filetests. It needs `gpt-rs`, which the IR filetests do without.
backend = ["dep:gpt-rs"]

[dependencies]
anyhow = { workspace = true }
gpt-rs = { path = "../gpt-rs", version = "0.1.0", optional = true }
gpt-rs-ir = { path = "../gpt-rs-ir", version = "0.1.0" }
half = "2.6"
rand = { workspace = true }
regex = "1"
